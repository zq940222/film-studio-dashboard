name: install smoke test

# 冒烟测试「发布安装」所用的机制：npm pack（触发 prepare 本机构建，产出与 Release 相同的 tgz）
# → 全局安装该 tgz（真实副本，与用户从 Release URL 安装同一条路径）→ 断言真实目录而非软链
# → version → 启动服务打 API/前端。在 macOS 与 Windows 上各跑一遍。
# 注：不测 git 全局安装——npm 对 git 全局安装跨 OS/npm 行为不一（软链/ENOTEMPTY），发布改走 tgz 规避。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: install & run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # 两个平台共用一套 bash 脚本（Windows 上走 git-bash），避免 PowerShell/bash 分叉。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # 显式 build 再 pack（已去掉 prepare 钩子），产出与发布相同的 tgz（含 web/dist + server/dist）。
      # 若 Windows 上 spawn npm 的 shell:true 写错、或 tsc/vite 构建失败，build 这一步就会红。
      - name: Build & pack (same tgz the release ships)
        run: |
          npm run build
          npm pack

      - name: Global-install the tarball (same path as installing from the release URL)
        run: npm install -g ./film-studio-dashboard-*.tgz

      # 断言全局包是真实目录（不是软链）、且 dist 已构建。用 node 判断，避开 Windows 下
      # `npm root -g` 返回反斜杠路径对 bash test 的坑。
      - name: Assert a real install (not a symlink) with built dist
        run: |
          node -e "const fs=require('fs'),p=require('path'),cp=require('child_process');const root=cp.execSync('npm root -g').toString().trim();const g=p.join(root,'film-studio-dashboard');if(fs.lstatSync(g).isSymbolicLink())throw new Error('unexpected symlink install: '+g);for(const f of ['web/dist/index.html','server/dist/server/src/index.js'])if(!fs.existsSync(p.join(g,f)))throw new Error('missing built file: '+f);console.log('real dir + dist present:',g)"

      - name: Version subcommand resolves on PATH
        run: film-studio-dashboard version

      - name: Boot server and smoke-test API + SPA + fs picker
        run: |
          set -e
          PORT=5799 film-studio-dashboard --no-open &
          SRV=$!
          # 轮询等待起服务（Windows runner 可能偏慢），再验证 API、前端首页、目录浏览接口
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5799/api/state
          echo
          curl -sf http://127.0.0.1:5799/ | grep -q 'id="root"'
          curl -sf http://127.0.0.1:5799/api/fs | grep -q '"entries"'
          echo "API + SPA + fs picker served OK"
          kill "$SRV" 2>/dev/null || true
