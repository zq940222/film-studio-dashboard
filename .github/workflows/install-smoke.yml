name: install smoke test

# 冒烟测试用户真正会敲的安装命令：在 macOS 与 Windows 上
# 「npm i -g --install-links git+https://…#SHA（真实 git 直装，触发 prepare 本机构建）
#  → 断言装成真实目录而非软链 → version → 启动服务 → 打 API/前端」。
#
# 为什么不用 npm pack + 安装 tarball：那条路会打包成普通 tarball 安装，
# 恰好绕开了 npm 对「git 全局安装」的行为（把包软链到用完即删的临时克隆），
# 从而给出假绿。必须走真实 git 路径 + --install-links 才能覆盖这个坑。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: install & run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # 两个平台共用一套 bash 脚本（Windows 上走 git-bash），避免 PowerShell/bash 分叉。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # 真实 git 路径：按被测 commit 的 SHA 从 GitHub 直装（远程 https，跨平台可靠）。
      # --install-links 让 npm 装成真实副本而非软链——这正是本 PR 修复的核心。
      - name: Install via the real git path (the documented command)
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "npm i -g --install-links git+https://github.com/$REPO.git#$SHA"
          npm i -g --install-links "git+https://github.com/$REPO.git#$SHA"

      # 关键断言：全局包必须是真实目录（不是软链到已清理的临时克隆），且 dist 已构建。
      # 用 node 做判断，避开 Windows 下 `npm root -g` 返回反斜杠路径对 bash test 的坑。
      - name: Assert a real install (not a dangling symlink) with built dist
        run: |
          node -e "const fs=require('fs'),p=require('path'),cp=require('child_process');const root=cp.execSync('npm root -g').toString().trim();const g=p.join(root,'film-studio-dashboard');if(fs.lstatSync(g).isSymbolicLink())throw new Error('DANGLING SYMLINK install: '+g);for(const f of ['web/dist/index.html','server/dist/server/src/index.js'])if(!fs.existsSync(p.join(g,f)))throw new Error('missing built file: '+f);console.log('real dir + dist present:',g)"

      - name: Version subcommand resolves on PATH
        run: film-studio-dashboard version

      - name: Boot server and smoke-test API + SPA
        run: |
          set -e
          PORT=5799 film-studio-dashboard &
          SRV=$!
          # 轮询等待起服务（Windows runner 可能偏慢），再验证 API 与前端首页
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5799/api/state
          echo
          curl -sf http://127.0.0.1:5799/ | grep -q 'id="root"'
          echo "API + SPA served OK"
          kill "$SRV" 2>/dev/null || true
