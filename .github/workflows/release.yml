name: release

# 打 tag（v*）即发布：CI 构建 + npm pack，产物重命名为稳定资源名后附到 GitHub Release。
# 安装与自更新都走 releases/latest/download/film-studio-dashboard.tgz 这条稳定 URL。
# tgz 是平台无关的（仅含 JS/CSS 预构建产物，运行期只依赖纯 JS 的 express），linux 上构建即可通用。

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 Release 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # 版本一致性：tag 必须等于 v+package.json 版本，避免发出 version 与 tag 对不上的包。
      - name: Assert tag matches package.json version
        run: |
          set -e
          PKG_VER=$(node -p "require('./package.json').version")
          TAG="${{ github.ref_name }}"
          [ "$TAG" = "v$PKG_VER" ] || { echo "::error::tag $TAG 与 package.json 版本 v$PKG_VER 不一致（先 bump package.json 再打 tag）"; exit 1; }
          echo "tag == v$PKG_VER OK"

      # 显式 build 再 pack（已去掉 prepare 钩子），构建 web/dist + server/dist 并打进 tgz。
      # 重命名为无版本号的稳定资源名，供 releases/latest/download 直链。
      - name: Build & pack
        run: |
          set -e
          npm run build
          npm pack
          mv film-studio-dashboard-*.tgz film-studio-dashboard.tgz
          ls -la film-studio-dashboard.tgz

      - name: Create GitHub Release and attach tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" film-studio-dashboard.tgz --title "${{ github.ref_name }}" --generate-notes
